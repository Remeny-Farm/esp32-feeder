# Reference Mosquitto 2.x config for the feeder fleet: mutual TLS only.
#
# All relative paths below resolve against the working directory of the
# broker process, so start it from server/:
#     cd server && mosquitto -c mosquitto/mosquitto.conf
# Paths used (all relative to server/):
#     certs/out/ca.crt       CA that signed the client certificates
#     certs/out/broker.crt   broker server certificate
#     certs/out/broker.key   broker private key
#     mosquitto/acl          topic ACL
#     data/                  persistence database (must be writable)
# The docker-compose.yml mounts the same layout under /mosquitto.

# Global options first. They must come before the first `listener` line.
per_listener_settings false
allow_anonymous false
allow_zero_length_clientid false
# Commands, acks, events and state are small JSON documents.
max_packet_size 65536

acl_file mosquitto/acl

persistence true
persistence_location data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# The only listener: MQTT over TLS. There is no plaintext listener.
listener 8883
protocol mqtt

cafile certs/out/ca.crt
certfile certs/out/broker.crt
keyfile certs/out/broker.key

# Every client must present a certificate signed by our CA.
require_certificate true
# The certificate CN becomes the MQTT username. The ACL keys on that name.
use_identity_as_username true

# TLS version: leave `tls_version` unset. Mosquitto 2.x then allows TLS 1.2
# and 1.3 (SSLv3, TLS 1.0 and 1.1 are off). Setting `tls_version tlsv1.2`
# would pin exactly 1.2 and switch 1.3 off, so it is not used here.
# TLS 1.2 suites: ECDHE with AEAD only (matches the EC P-256 certificates).
ciphers ECDHE+AESGCM:ECDHE+CHACHA20
